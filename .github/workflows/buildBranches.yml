name: Build Branches

on:
    push:
        branches:
            - main
            - dev
            - i18n_translation
            - translation
            - bun
            - dev2
    workflow_dispatch:
        inputs:
            branch:
                type: choice
                description: "Branch to build and upload"
                options:
                    - main
                    - dev
                    - translation
                default: "dev"

env:
    FORCE_COLOR: true
    REPO: slipcords/Slipping
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Slipcord
        runs-on: ubuntu-latest
        # Must match the canonical owner casing. The org was renamed to lowercase
        # `slipcords`, which made this comparison false and silently skipped the whole job.
        if: github.repository == 'slipcords/Slipcord'

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.inputs.branch || github.ref }}

            - uses: pnpm/action-setup@v6
              if: github.ref_name != 'bun'

            - name: Use Node.js 24
              if: github.ref_name != 'bun'
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              if: github.ref_name != 'bun'
              run: pnpm install --frozen-lockfile

            - name: Build web
              if: github.ref_name != 'bun'
              run: pnpm buildWebStandalone

            - name: Build
              if: github.ref_name != 'bun'
              run: pnpm buildStandalone

            - name: Generate plugin lists
              if: github.ref_name != 'bun'
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateSlipcordPluginJson dist/slipcordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - uses: oven-sh/setup-bun@v2
              if: github.ref_name == 'bun'
              with:
                  bun-version: latest
            - name: Install dependencies
              if: github.ref_name == 'bun'
              run: bun install

            - name: Build web
              if: github.ref_name == 'bun'
              run: bun run buildWebStandalone

            - name: Build
              if: github.ref_name == 'bun'
              run: bun run buildStandalone

            - name: Generate plugin lists
              if: github.ref_name == 'bun'
              run: |
                  bun run generatePluginJson dist/plugins.json
                  bun run generateSlipcordPluginJson dist/slipcordplugins.json
                  bun run generateVencordPluginJson dist/vencordplugins.json
                  bun run generateDevsList dist/devs.json

            - name: Upload to Slipping repo
              env:
                  ASKPASS_TOKEN: ${{ secrets.ETOKEN }}
              run: |
                  BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
                  COMMIT_SHA=$(git rev-parse --short HEAD)

                  if [ -z "$ASKPASS_TOKEN" ]; then
                    echo "::warning::secrets.ETOKEN is not set - cannot push to $REPO."
                    exit 0
                  fi

                  # Keep the token out of argv and out of the remote config.
                  cat > "$RUNNER_TEMP/askpass.sh" <<'EOF'
                  #!/bin/sh
                  case "$1" in
                    *Username*) echo "x-access-token" ;;
                    *Password*) echo "$ASKPASS_TOKEN" ;;
                  esac
                  EOF
                  chmod +x "$RUNNER_TEMP/askpass.sh"
                  export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh" GIT_TERMINAL_PROMPT=0

                  git config --global user.name "$USERNAME"
                  git config --global user.email "actions@github.com"

                  mkdir slipping && cd slipping
                  git init -b "$BRANCH"
                  git remote add origin "https://github.com/$REPO.git"

                  if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
                      git fetch --depth 1 origin "$BRANCH"
                      git checkout "$BRANCH"
                  else
                      git checkout --orphan "$BRANCH"
                  fi

                  cp -r ../dist/* .
                  find . -size 0 -delete

                  mkdir -p userscript
                  mv Slipcord.user.* userscript/
                  mv desktop.asar desktop/
                  mv extension-*.zip browser/

                  git add -A
                  git commit -m "Builds for https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"
                  git push --force origin "$BRANCH"
